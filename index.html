<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hytale Mod - Schedule & JSON Gen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b0f1a;
        }

        .card {
            background: #161b2c;
            border: 1px solid #2d3748;
        }

        .input-field {
            background: #0b0f1a;
            border: 1px solid #2d3748;
            color: #fff;
        }

        .input-field:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
            outline: none;
        }

        .tab-btn {
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }

        .tab-active {
            border-bottom-color: #22d3ee;
            color: #22d3ee;
        }

        .custom-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #2d3748;
            border-radius: 0.375rem;
            background: #0b0f1a;
            cursor: pointer;
            position: relative;
        }

        .custom-checkbox:checked {
            background: #22d3ee;
            border-color: #22d3ee;
        }

        .custom-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: #0b0f1a;
            font-weight: bold;
            left: 3px;
            top: -2px;
        }

        .toggle-dot {
            transition: all 0.3s ease-in-out;
        }

        input:checked~.toggle-dot {
            transform: translateX(100%);
            background-color: #22d3ee;
        }
    </style>
</head>

<body class="text-slate-200 min-h-screen flex items-center justify-center p-4 py-12">

    <div class="fixed top-6 right-6 flex gap-2">
        <button onclick="setLanguage('en')"
            class="bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-lg text-xs font-bold border border-slate-700 transition"
            id="lang-en">EN</button>
        <button onclick="setLanguage('es')"
            class="bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-lg text-xs font-bold border border-slate-700 transition"
            id="lang-es">ES</button>
    </div>

    <div class="max-w-3xl w-full card rounded-[2.5rem] shadow-2xl p-8 md:p-12">
        <div class="mb-10">
            <h1 class="text-3xl font-extrabold text-white" id="txt-title">Hytale Mod Scheduler</h1>
            <p class="text-slate-400 text-sm mt-2" id="txt-subtitle">Create automated messages for your server.</p>
        </div>

        <div class="flex border-b border-slate-700 mb-8 gap-8 text-slate-500">
            <button onclick="switchTab('simple')" id="btn-simple"
                class="tab-btn pb-4 text-xs font-black uppercase tracking-widest tab-active">Time Settings</button>
            <button onclick="switchTab('weekly')" id="btn-weekly"
                class="tab-btn pb-4 text-xs font-black uppercase tracking-widest">Days</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="space-y-2">
                <div class="flex justify-between items-center px-1">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"
                        id="label-min">Minute</label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <span class="text-[10px] font-bold text-slate-500 group-hover:text-cyan-400 transition"
                            id="txt-every-m">Every?</span>
                        <input type="checkbox" id="check-m" onchange="genCron()" class="custom-checkbox">
                    </label>
                </div>
                <input type="text" id="cron-m" value="0" oninput="genCron()"
                    class="input-field w-full rounded-xl px-4 py-3 font-mono">
            </div>
            <div class="space-y-2">
                <div class="flex justify-between items-center px-1">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"
                        id="label-hour">Hour</label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <span class="text-[10px] font-bold text-slate-500 group-hover:text-cyan-400 transition"
                            id="txt-every-h-check">Every?</span>
                        <input type="checkbox" id="check-h" onchange="genCron()" class="custom-checkbox">
                    </label>
                </div>
                <input type="text" id="cron-h" value="*" oninput="genCron()"
                    class="input-field w-full rounded-xl px-4 py-3 font-mono">
            </div>
        </div>

        <div id="panel-weekly" class="hidden bg-slate-900/50 p-6 rounded-2xl border border-slate-700 mb-8">
            <div class="flex flex-wrap gap-2" id="day-container"></div>
        </div>

        <div class="space-y-6 bg-slate-900/30 p-6 rounded-3xl border border-slate-700 mb-8">
            <div class="space-y-2">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"
                    id="label-msg">Announcement Message</label>
                <textarea id="msg-text" oninput="genCron()"
                    class="input-field w-full rounded-xl px-4 py-3 h-24 resize-none"
                    placeholder="Welcome to the server!"></textarea>
            </div>

            <div class="flex items-center justify-between pt-4 border-t border-slate-700/50">
                <div>
                    <p class="text-sm font-bold text-white" id="txt-is-toast">Display as Emblem (Toast)?</p>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter" id="txt-is-toast-desc">
                        Big screen notification vs small chat text.</p>
                </div>
                <label class="flex items-center cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" id="is-toast-check" class="sr-only" onchange="genCron()">
                        <div class="block bg-slate-800 w-14 h-8 rounded-full border border-slate-600"></div>
                        <div
                            class="toggle-dot absolute left-1 top-1 bg-slate-400 w-6 h-6 rounded-full transition shadow-sm">
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <div class="bg-slate-950 rounded-[2rem] p-8 border border-cyan-500/20 shadow-2xl">
            <p class="text-[10px] font-black text-cyan-500 uppercase tracking-[0.25em] mb-4">Final Configuration JSON
            </p>
            <pre id="json-output"
                class="text-cyan-400 font-mono text-xs leading-relaxed overflow-x-auto p-5 bg-slate-900/80 rounded-2xl border border-slate-800 mb-6"></pre>

            <div class="flex flex-col md:flex-row items-center justify-between gap-6 border-t border-slate-800 pt-6">
                <p id="human-readable" class="text-[11px] text-slate-500 italic flex-1"></p>
                <button onclick="copyToClipboard()" id="copy-btn"
                    class="w-full md:w-auto bg-cyan-500 hover:bg-cyan-400 text-slate-950 px-10 py-4 rounded-xl font-black text-xs uppercase tracking-widest transition-all active:scale-95 shadow-lg shadow-cyan-500/10">
                    Copy Code
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'en';
        let selectedDays = ['*'];

        const i18n = {
            en: {
                title: "Hytale Scheduler", subtitle: "Automated announcements configuration.",
                label_min: "Minute", label_hour: "Hour", label_msg: "Message Content",
                every: "Every?", copy: "Copy JSON", copied: "COPIED!",
                toast: "Display as Emblem (Toast)?", toast_desc: "Big screen notification vs small chat text.",
                days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], msg_pre: "Will run "
            },
            es: {
                title: "Generador Hytale", subtitle: "Configuración de anuncios automáticos.",
                label_min: "Minuto", label_hour: "Hora", label_msg: "Contenido del Mensaje",
                every: "¿Cada?", copy: "Copiar JSON", copied: "¡COPIADO!",
                toast: "¿Mostrar como Emblema (Toast)?", toast_desc: "Notificación grande vs texto pequeño en chat.",
                days: ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"], msg_pre: "Se ejecutará "
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('label-min').innerText = t.label_min;
            document.getElementById('label-hour').innerText = t.label_hour;
            document.getElementById('label-msg').innerText = t.label_msg;
            document.getElementById('txt-every-m').innerText = t.every;
            document.getElementById('txt-every-h-check').innerText = t.every;
            document.getElementById('txt-is-toast').innerText = t.toast;
            document.getElementById('txt-is-toast-desc').innerText = t.toast_desc;
            document.getElementById('copy-btn').innerText = t.copy;
            renderDays(); genCron();
        }

        function renderDays() {
            const container = document.getElementById('day-container');
            const t = i18n[currentLang];
            container.innerHTML = `<button onclick="toggleDay(this, '*')" class="day-chip ${selectedDays.includes('*') ? 'bg-cyan-500 text-slate-950' : 'bg-slate-700'} px-4 py-2 rounded-xl text-xs font-bold">All</button>`;
            t.days.forEach((day, i) => {
                const val = i.toString();
                container.innerHTML += `<button onclick="toggleDay(this, '${val}')" class="day-chip ${selectedDays.includes(val) ? 'bg-cyan-500 text-slate-950' : 'bg-slate-700'} px-4 py-2 rounded-xl text-xs font-bold">${day}</button>`;
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active', 'text-slate-200'));
            document.getElementById('btn-' + tab).classList.add('tab-active');
            document.getElementById('panel-weekly').classList.toggle('hidden', tab !== 'weekly');
        }

        function toggleDay(btn, day) {
            if (day === '*') selectedDays = ['*'];
            else {
                selectedDays = selectedDays.filter(d => d !== '*');
                if (selectedDays.includes(day)) selectedDays = selectedDays.filter(d => d !== day);
                else selectedDays.push(day);
                if (selectedDays.length === 0) selectedDays = ['*'];
            }
            renderDays(); genCron();
        }

        function genCron() {
            let m = document.getElementById('cron-m').value || '0';
            let h = document.getElementById('cron-h').value || '*';
            const msg = document.getElementById('msg-text').value || "Welcome to our server!";
            const isToast = document.getElementById('is-toast-check').checked;

            if (document.getElementById('check-m').checked && m !== '*' && !m.includes('/')) m = '*/' + m;
            if (document.getElementById('check-h').checked && h !== '*' && !h.includes('/')) h = '*/' + h;

            const cron = `${m} ${h} * * ${selectedDays.sort().join(',')}`;
            const jsonObj = { Schedule: cron, IsToast: isToast, Message: msg };

            document.getElementById('json-output').innerText = JSON.stringify(jsonObj, null, 4);
            updateHumanReadable(m, h, selectedDays.join(','));
        }

        function updateHumanReadable(m, h, d) {
            let res = "";
            const isMi = m.includes('*/'), isHi = h.includes('*/');

            // Traducciones internas para la frase
            const t = {
                en: {
                    run: "Will run ",
                    every: "every ",
                    min: " min",
                    hour: " hour",
                    hours: " hours",
                    at: "at ",
                    atMin: "at minute ",
                    onDays: " on selected days",
                    everyMin: "every minute",
                    allHours: "of every hour"
                },
                es: {
                    run: "Se ejecutará ",
                    every: "cada ",
                    min: " min",
                    hour: " hora",
                    hours: " horas",
                    at: "a las ",
                    atMin: "en el minuto ",
                    onDays: " los días seleccionados",
                    everyMin: "cada minuto",
                    allHours: "de todas las horas"
                }
            }[currentLang];

            res = t.run;

            // LÓGICA DE TRADUCCIÓN
            if (isMi && isHi) {
                // Ejemplo: */10 */2 (Cada 2 horas en intervalos de 10 min)
                res += `${t.every}${h.split('/')[1]}${t.hours}, ${currentLang === 'es' ? 'en intervalos de' : 'in'} ${m.split('/')[1]}${t.min}`;
            }
            else if (isMi) {
                // Ejemplo: */15 * (Cada 15 minutos de todas las horas)
                res += `${t.every}${m.split('/')[1]}${t.min} `;
                res += (h === '*') ? t.allHours : `${t.at}${h}:00`;
            }
            else if (isHi) {
                // Ejemplo: 0 */3 (Al minuto 0 cada 3 horas)
                res += `${t.atMin}${m} ${t.every}${h.split('/')[1]}${t.hours}`;
            }
            else {
                // Ejemplo: 0 12 (A las 12:00)
                const hh = (h === '*') ? (currentLang === 'es' ? "cada hora" : "every hour") : `${h}:00`;
                const mm = (m === '*' || m === '0') ? "" : ` ${t.atMin}${m}`;
                res += `${t.at}${hh}${mm}`;
            }

            if (d !== '*') res += t.onDays;

            document.getElementById('human-readable').innerText = `"${res}."`;
        }

        setLanguage('en');
    </script>
</body>

</html>
